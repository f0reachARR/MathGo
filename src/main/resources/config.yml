world:
  name: "mathgo_world"
  area_size: 256
  lobby_x: 0.5
  lobby_y: 64.0
  lobby_z: 0.5

game:
  countdown_seconds: 5
  answer_result_effect_seconds: 1.5

rules:
  stage_clear:
    initial_lives: 3
    checkpoints: 5
  survival:
    initial_lives: 3
    max_questions: 30

quiz:
  enabled_types: [ADD, SUB, MUL, DIV, MIXED]
  default_time_limit:
    easy: 6
    normal: 5
    hard: 4
  difficulty: NORMAL
  allow_negative: false
  allow_decimal: false

track:
  template_set: "default"
  weighted_random: true

# Where NBT templates are loaded into the world during the startup scan that extracts marker metadata.
# This area must be far from any reserved game area; blocks here are placed and cleared per template.
templates:
  scratch_x: -100000
  scratch_y: 64
  scratch_z: -100000

# MySQL connection for score recording / leaderboard.
# Set enabled=false to disable persistence (scores will be in-memory only and lost on restart).
database:
  enabled: false
  host: localhost
  port: 3306
  database: mathgo
  username: mathgo
  password: changeme
  table: mathgo_scores
  pool_size: 4
